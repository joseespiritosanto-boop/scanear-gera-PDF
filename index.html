<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SPX | Scanner Mobile NF</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --spx-orange: #EE4D2D;
      --bg: #F4F5F7;
      --card: #FFFFFF;
      --text: #181C24;
      --muted: #6B7280;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 24px; }

    .topbar {
      background: #FFFFFF;
      border-bottom: 3px solid var(--spx-orange);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge { background: var(--spx-orange); color: #fff; font-weight: 800; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
    .topbar h1 { font-size: 15px; font-weight: 800; }

    .wrap { max-width: 600px; margin: 0 auto; padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }

    .camera-box {
      position: relative;
      width: 100%;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      min-height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, canvas { width: 100%; max-height: 420px; object-fit: contain; display: block; }
    canvas { display: none; background: #fff; }
    .guia-doc {
      position: absolute;
      inset: 14px;
      border: 2px dashed rgba(238, 77, 45, 0.85);
      border-radius: 10px;
      pointer-events: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-spx { background: var(--spx-orange); color: #fff; }
    .btn-dark { background: #181C24; color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select { width: 100%; padding: 10px; border: 1.5px solid #D1D5DB; border-radius: 10px; font-size: 13px; margin-top: 8px; background: #fff; }

    .status {
      margin-top: 10px;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }
    .info { background: #FFF2EE; color: #9A3412; border: 1px solid #FDBA74; }
    .ok { background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; }
    .err { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="badge">SPX</span>
    <h1>SCANNER MOBILE DE NOTA FISCAL</h1>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="camera-box">
        <video id="videoCam" autoplay playsinline muted></video>
        <canvas id="canvasDoc"></canvas>
        <div class="guia-doc" id="guiaDoc"></div>
      </div>

      <select id="filtroModo" onchange="aplicarTratamentoImagem()">
        <option value="doc_nitido">Modo Documento Nítido (Alto Contraste)</option>
        <option value="cinza">Modo Cinza Limpo</option>
        <option value="colorido">Modo Colorido Otimizado</option>
      </select>

      <div class="row-2">
        <button class="btn btn-dark" type="button" id="btnRefazer" onclick="ligarCamera()">🔄 Câmera</button>
        <button class="btn btn-spx" type="button" id="btnCapturar" onclick="capturarDocumento()">📸 DIGITALIZAR NOTA</button>
      </div>

      <!-- Fallback nativo para dispositivos móveis onde getUserMedia seja bloqueado -->
      <input type="file" id="inputFallbackCam" accept="image/*" capture="environment" style="display:none" />
      <button class="btn btn-outline" type="button" onclick="document.getElementById('inputFallbackCam').click()">
        📱 Usar Câmera Nativa do Celular
      </button>

      <button class="btn btn-spx" type="button" id="btnProcessarEnviar" onclick="processarOcrERetornar()" disabled>
        ⚡ LER OCR E ENVIAR PARA CONFERÊNCIA
      </button>

      <div id="statusBox" class="status"></div>
    </div>
  </div>

  <script>
    let streamAtual = null;
    let imagemCapturada = null;

    window.addEventListener("load", ligarCamera);

    async function ligarCamera() {
      try {
        if (streamAtual) streamAtual.getTracks().forEach(t => t.stop());
        const video = document.getElementById("videoCam");
        const canvas = document.getElementById("canvasDoc");
        video.style.display = "block";
        canvas.style.display = "none";
        document.getElementById("guiaDoc").style.display = "block";

        streamAtual = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1600 }, height: { ideal: 1200 } },
          audio: false
        });
        video.srcObject = streamAtual;
        setStatus("info", "Enquadre a nota fiscal na área pontilhada e toque em DIGITALIZAR NOTA.");
      } catch (e) {
        setStatus("info", "Toque em 'Usar Câmera Nativa do Celular' abaixo para fotografar a nota.");
      }
    }

    document.getElementById("inputFallbackCam").addEventListener("change", function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        carregarImagemNoCanvas(ev.target.result);
      };
      reader.readAsDataURL(file);
    });

    function capturarDocumento() {
      const video = document.getElementById("videoCam");
      if (!video.videoWidth) {
        document.getElementById("inputFallbackCam").click();
        return;
      }
      const temp = document.createElement("canvas");
      temp.width = video.videoWidth;
      temp.height = video.videoHeight;
      temp.getContext("2d").drawImage(video, 0, 0);
      carregarImagemNoCanvas(temp.toDataURL("image/jpeg", 0.92));
      if (streamAtual) streamAtual.getTracks().forEach(t => t.stop());
    }

    function carregarImagemNoCanvas(dataUrl) {
      const img = new Image();
      img.onload = function() {
        imagemCapturada = img;
        document.getElementById("videoCam").style.display = "none";
        document.getElementById("guiaDoc").style.display = "none";
        const canvas = document.getElementById("canvasDoc");
        canvas.style.display = "block";

        const maxLado = 1280;
        const escala = Math.max(img.width, img.height) > maxLado ? maxLado / Math.max(img.width, img.height) : 1;
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);

        aplicarTratamentoImagem();
        document.getElementById("btnProcessarEnviar").disabled = false;
        setStatus("ok", "Documento digitalizado! Toque em 'LER OCR E ENVIAR PARA CONFERÊNCIA'.");
      };
      img.src = dataUrl;
    }

    function aplicarTratamentoImagem() {
      if (!imagemCapturada) return;
      const canvas = document.getElementById("canvasDoc");
      const ctx = canvas.getContext("2d");
      const modo = document.getElementById("filtroModo").value;

      ctx.drawImage(imagemCapturada, 0, 0, canvas.width, canvas.height);
      if (modo === "colorido") return;

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (modo === "doc_nitido") {
          g = g > 172 ? 255 : Math.max(0, (g - 60) * 1.6);
        } else {
          g = Math.min(255, Math.max(0, (g - 128) * 1.25 + 138));
        }
        d[i] = d[i + 1] = d[i + 2] = g;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Parser inteligente: separa cabeçalho e itens reais (ignora impostos, frete, descontos e totais)
    function analisarTextoNotaFiscal(textoBruto) {
      const texto = String(textoBruto || "");
      const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const somenteDigitos = texto.replace(/\D/g, "");

      // 1. Chave NF-e (44 dígitos)
      const matchChave = somenteDigitos.match(/\d{44}/);
      const chave = matchChave ? matchChave[0] : "";

      // 2. Número da NF (pela chave nos dígitos 26..34 ou por padrão textual)
      let numeroNota = "";
      if (chave) {
        numeroNota = String(parseInt(chave.substring(25, 34), 10) || "");
      }
      if (!numeroNota) {
        const mNum = texto.match(/(?:N[º°o.\s]*|NF-?E[:\s]*|NOTA[:\s]*)0*(\d{3,9})/i);
        if (mNum) numeroNota = mNum[1];
      }

      // 3. Fornecedor / Emitente (primeiras linhas em caixa alta antes de DANFE/CNPJ)
      let fornecedor = "";
      for (let i = 0; i < Math.min(8, linhas.length); i++) {
        const l = linhas[i];
        if (/DANFE|DOCUMENTO AUXILIAR|CHAVE DE ACESSO|CONSULTA DE AUTENTICIDADE|RECEBEMOS/i.test(l)) continue;
        if (l.length >= 5 && /[A-Z]{3,}/.test(l) && !/^\d+$/.test(l)) {
          fornecedor = l.replace(/[^A-Z0-9\s.&-]/gi, "").trim().slice(0, 60);
          break;
        }
      }

      // 4. Valor Total da Nota
      let valorTotal = 0;
      const mTotalNota = texto.match(/VALOR\s+TOTAL\s+DA\s+NOTA[^\d]*(\d{1,3}(?:\.\d{3})*,\d{2})/i)
        || texto.match(/TOTAL\s+(?:GERAL|A\s+PAGAR|NF)[^\d]*(\d{1,3}(?:\.\d{3})*,\d{2})/i);
      if (mTotalNota) {
        valorTotal = parseFloat(mTotalNota[1].replace(/\./g, "").replace(",", ".")) || 0;
      }

      // 5. Itens reais (filtra linhas de impostos, totais, frete e descontos)
      const termosExcluidos = /(?:VALOR\s+TOTAL|SUBTOTAL|TOTAL\s+DOS\s+PRODUTOS|FRETE|SEGURO|DESCONTO|OUTRAS\s+DESPESAS|BASE\s+DE\s+C[AÁ]LCULO|ICMS|IPI|PIS|COFINS|ISSQN|TRIBUTOS|TROCO|DINHEIRO|CART[AÃ]O|PIX|DUPLICATA|FATURA|PARCELA)/i;
      const itens = [];

      for (const linha of linhas) {
        if (termosExcluidos.test(linha)) continue;
        // Padrão: Descrição + Qtd + VlUnit + VlTotal no final da linha
        const mCompleto = linha.match(/^(.{4,65}?)\s+(\d+(?:[.,]\d{1,3})?)\s+(?:UN|PC|CX|KG|LT|PAR|KT)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})\s+(\d{1,3}(?:\.\d{3})*,\d{2})$/i);
        if (mCompleto) {
          const nome = mCompleto[1].replace(/^[\d.\-\s]+/, "").trim();
          const qtd = parseFloat(mCompleto[2].replace(",", ".")) || 1;
          const vUnit = parseFloat(mCompleto[3].replace(/\./g, "").replace(",", ".")) || 0;
          const vTot = parseFloat(mCompleto[4].replace(/\./g, "").replace(",", ".")) || (qtd * vUnit);
          if (nome.length >= 3 && vTot > 0 && vTot !== valorTotal) {
            itens.push({ produto: nome, descricao: nome, quantidade: qtd, valorUnitario: vUnit, valorTotal: vTot });
            continue;
          }
        }

        // Padrão alternativo: Descrição + Valor Total no fim da linha
        const mSimples = linha.match(/^(.{5,65}?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})$/);
        if (mSimples) {
          const nome = mSimples[1].replace(/^[\d.\-\s]+/, "").trim();
          const vTot = parseFloat(mSimples[2].replace(/\./g, "").replace(",", ".")) || 0;
          if (nome.length >= 4 && !/^\d+$/.test(nome) && vTot > 0 && vTot !== valorTotal) {
            itens.push({ produto: nome, descricao: nome, quantidade: 1, valorUnitario: vTot, valorTotal: vTot });
          }
        }
      }

      if (!valorTotal && itens.length > 0) {
        valorTotal = itens.reduce((acc, it) => acc + it.valorTotal, 0);
      }

      return {
        numeroNota: numeroNota,
        fornecedor: fornecedor,
        chave: chave,
        valorTotal: Number(valorTotal.toFixed(2)),
        itens: itens.slice(0, 30)
      };
    }

    async function processarOcrERetornar() {
      if (!imagemCapturada) return setStatus("err", "Digitalize a nota primeiro.");
      const btn = document.getElementById("btnProcessarEnviar");
      btn.disabled = true;
      btn.textContent = "⏳ LENDO OCR E MONTANDO PDF...";
      setStatus("info", "Extraindo informações da nota fiscal...");

      try {
        const canvas = document.getElementById("canvasDoc");
        const { data } = await Tesseract.recognize(canvas, "por");
        const estruturado = analisarTextoNotaFiscal(data.text || "");
        estruturado.confiancaOcr = data.confidence || 0;

        // Comprime imagem para envio rápido no celular
        const imagemDataUrl = canvas.toDataURL("image/jpeg", 0.72);
        estruturado.imagemBase64 = imagemDataUrl.split(",")[1];

        // Gera PDF da digitalização no lado do scanner também
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        pdf.addImage(imagemDataUrl, "JPEG", 8, 8, 194, 275);
        estruturado.pdfBase64 = pdf.output("datauristring").split(",")[1];

        // 1. Tenta devolver diretamente para a janela do Apps Script que abriu o scanner
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            tipo: "SPX_SCANNER_RESULTADO",
            dados: estruturado
          }, "*");
          setStatus("ok", "Dados enviados para a tela de Conferência do Apps Script!");
          setTimeout(function() { window.close(); }, 700);
          return;
        }

        // 2. Fallback caso o scanner tenha sido aberto diretamente sem window.opener
        const jsonCompacto = JSON.stringify({
          numeroNota: estruturado.numeroNota,
          fornecedor: estruturado.fornecedor,
          chave: estruturado.chave,
          valorTotal: estruturado.valorTotal,
          itens: estruturado.itens,
          confiancaOcr: estruturado.confiancaOcr
        });
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(jsonCompacto);
        }
        setStatus("ok", "Leitura concluída e copiada! Volte ao Apps Script e cole no campo de retorno alternativo.");
      } catch (e) {
        setStatus("err", "Falha ao ler nota: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "⚡ LER OCR E ENVIAR PARA CONFERÊNCIA";
      }
    }

    function setStatus(tipo, msg) {
      const el = document.getElementById("statusBox");
      el.className = "status " + tipo;
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
