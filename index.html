<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPX | Scanner de Nota Fiscal</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #F3F4F6; color: #111827; padding: 14px; }
    .container { max-width: 740px; margin: 0 auto; }
    .header { background: linear-gradient(90deg, #181C24 0%, #262C3A 55%, #EE4D2D 100%); color: #fff; padding: 16px; border-radius: 10px; margin-bottom: 14px; }
    .header h1 { font-size: 18px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.9; }
    .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #E5E7EB; }
    .card h2 { font-size: 14px; margin-bottom: 10px; color: #181C24; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #374151; }
    input, select { width: 100%; padding: 9px; border: 1px solid #D1D5DB; border-radius: 7px; font-size: 13px; margin-bottom: 10px; }
    input:focus, select:focus { outline: none; border-color: #EE4D2D; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    video, canvas { width: 100%; border: 1px solid #E5E7EB; border-radius: 8px; background: #111827; margin-top: 8px; max-height: 360px; object-fit: contain; }
    canvas { background: #fff; display: none; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 7px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px; }
    .btn-spx { background: #EE4D2D; color: #fff; }
    .btn-dark { background: #181C24; color: #fff; }
    .btn-gray { background: #4B5563; color: #fff; }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { border: 1px solid #E5E7EB; padding: 6px; text-align: left; }
    th { background: #F9FAFB; }
    .status { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; white-space: pre-line; }
    .ok { background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; }
    .err { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
    .info { background: #E0F2FE; color: #075985; border: 1px solid #7DD3FC; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📷 SPX | Scanner de Nota Fiscal</h1>
      <p>Escaneia a nota pela câmera, lê as informações e envia para o Apps Script tratar</p>
    </div>

    <div class="card">
      <h2>1. Escanear Nota Física (Câmera)</h2>
      <div class="row">
        <button class="btn btn-dark" type="button" id="btnCamera" onclick="iniciarCamera()">🎥 Ligar Câmera</button>
        <button class="btn btn-spx" type="button" id="btnEscanear" onclick="escanearQuadro()" disabled>📸 Escanear Nota</button>
      </div>

      <label style="margin-top:10px">Filtro de escaneamento</label>
      <select id="modoFiltro" onchange="aplicarFiltroScanner()">
        <option value="doc_nitido">Documento Nítido (Alto Contraste / PB)</option>
        <option value="cinza_limpo">Tons de Cinza Limpo</option>
        <option value="original">Original</option>
      </select>

      <video id="videoPreview" autoplay playsinline muted></video>
      <canvas id="scanCanvas"></canvas>
      <button class="btn btn-dark" type="button" id="btnOcr" onclick="executarOcr()" disabled>🔍 Ler Informações e Itens (OCR)</button>
    </div>

    <div class="card">
      <h2>2. Informações Lidas e Itens</h2>
      <div class="row">
        <div>
          <label>Nº da Nota Fiscal *</label>
          <input type="text" id="numeroNota" placeholder="Ex.: 819105" />
        </div>
        <div>
          <label>Fornecedor / Emitente *</label>
          <input type="text" id="fornecedor" placeholder="Ex.: 1000 MARCAS SAFETY" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Categoria dos Itens *</label>
          <select id="categoria">
            <option value="EPI / Segurança">EPI / Segurança</option>
            <option value="Insumos Operacionais">Insumos Operacionais</option>
            <option value="Manutenção / Infraestrutura">Manutenção / Infraestrutura</option>
            <option value="TI / Impressoras / Coletores">TI / Impressoras / Coletores</option>
            <option value="Limpeza / Copa">Limpeza / Copa</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div>
          <label>Nome de Quem Recebeu *</label>
          <input type="text" id="recebedor" placeholder="Nome de quem recebeu" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Chave NF-e (44 dígitos - opcional)</label>
          <input type="text" id="chaveNf" maxlength="44" placeholder="Opcional" />
        </div>
        <div>
          <label>E-mail Destinatário</label>
          <input type="email" id="emailDestino" value="jose.espiritosanto@shopee.com" />
        </div>
      </div>

      <label>Adicionar / ajustar item</label>
      <div class="row">
        <input type="text" id="itemCod" placeholder="Código (opcional)" />
        <input type="text" id="itemNome" placeholder="Produto / Descrição" />
      </div>
      <div class="row">
        <input type="number" id="itemQtd" placeholder="Qtd" value="1" step="0.01" />
        <input type="number" id="itemValor" placeholder="Vl. Unit. (R$)" value="0" step="0.01" />
      </div>
      <button class="btn btn-gray" type="button" onclick="adicionarItemManual()">+ Adicionar Item</button>

      <table>
        <thead>
          <tr><th>Cód</th><th>Produto</th><th>Qtd</th><th>Vl. Unit.</th><th>Total</th><th>Ação</th></tr>
        </thead>
        <tbody id="listaItensBody"></tbody>
      </table>

      <button class="btn btn-spx" type="button" id="btnEnviar" onclick="enviarDadosParaAppsScript()">🚀 Enviar Dados para o Apps Script</button>
      <div id="statusBox" class="status"></div>
    </div>
  </div>

  <script>
    // Cole aqui a URL /exec do seu Web App do Google Apps Script
    const APPS_SCRIPT_EXEC_URL = "COLE_AQUI_SUA_URL_EXEC";

    let streamAtivo = null;
    let quadroCapturado = null;
    let itensNota = [];

    window.addEventListener("load", function() {
      iniciarCamera();
    });

    async function iniciarCamera() {
      try {
        if (streamAtivo) {
          streamAtivo.getTracks().forEach(t => t.stop());
        }
        const video = document.getElementById("videoPreview");
        video.style.display = "block";
        document.getElementById("scanCanvas").style.display = "none";

        streamAtivo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = streamAtivo;
        document.getElementById("btnEscanear").disabled = false;
        setStatus("info", "Câmera ligada. Posicione a nota fiscal e toque em 'Escanear Nota'.");
      } catch (err) {
        setStatus(
          "err",
          "Não foi possível abrir a câmera diretamente (" + err.message + ").\n" +
          "Verifique se o navegador tem permissão de câmera para este site."
        );
      }
    }

    function escanearQuadro() {
      const video = document.getElementById("videoPreview");
      const canvas = document.getElementById("scanCanvas");
      if (!video.videoWidth || !video.videoHeight) {
        return setStatus("err", "Aguarde a imagem da câmera aparecer antes de escanear.");
      }

      const maxW = 900;
      const escala = video.videoWidth > maxW ? maxW / video.videoWidth : 1;
      canvas.width = Math.round(video.videoWidth * escala);
      canvas.height = Math.round(video.videoHeight * escala);

      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCanvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

      const img = new Image();
      img.onload = function() {
        quadroCapturado = img;
        video.style.display = "none";
        canvas.style.display = "block";
        document.getElementById("btnOcr").disabled = false;
        aplicarFiltroScanner();
        setStatus("ok", "Nota escaneada! Agora clique em 'Ler Informações e Itens (OCR)' ou preencha os campos.");
      };
      img.src = tempCanvas.toDataURL("image/jpeg", 0.85);
    }

    function aplicarFiltroScanner() {
      if (!quadroCapturado) return;
      const canvas = document.getElementById("scanCanvas");
      const ctx = canvas.getContext("2d");
      const modo = document.getElementById("modoFiltro").value;

      ctx.drawImage(quadroCapturado, 0, 0, canvas.width, canvas.height);
      if (modo === "original") return;

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (modo === "doc_nitido") {
          gray = gray > 168 ? 255 : Math.max(0, (gray - 65) * 1.65);
        } else if (modo === "cinza_limpo") {
          gray = Math.min(255, Math.max(0, (gray - 128) * 1.25 + 138));
        }
        data[i] = data[i + 1] = data[i + 2] = gray;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    async function executarOcr() {
      if (!quadroCapturado) return setStatus("err", "Escaneie a nota primeiro.");
      const btn = document.getElementById("btnOcr");
      btn.disabled = true;
      btn.textContent = "⏳ Lendo informações...";
      setStatus("info", "Extraindo texto e itens da nota escaneada...");

      try {
        const canvas = document.getElementById("scanCanvas");
        const { data } = await Tesseract.recognize(canvas, "por");
        const texto = data.text || "";

        const matchChave = texto.replace(/\D/g, "").match(/\d{44}/);
        if (matchChave && !document.getElementById("chaveNf").value) {
          document.getElementById("chaveNf").value = matchChave[0];
        }

        const matchNum = texto.match(/(?:N[º°o.\s]*|NOTA[:\s]*)(\d{3,9})/i);
        if (matchNum && !document.getElementById("numeroNota").value) {
          document.getElementById("numeroNota").value = matchNum[1];
        }

        const linhas = texto.split("\n").map(l => l.trim()).filter(Boolean);
        let adicionados = 0;
        for (const linha of linhas) {
          const matchValor = linha.match(/(\d+[.,]\d{2})\s*$/);
          if (matchValor && linha.length > 8 && adicionados < 15) {
            const vTot = parseFloat(matchValor[1].replace(",", "."));
            const desc = linha.replace(/(\d+[.,]\d{2})\s*$/, "").trim();
            if (vTot > 0 && desc.length >= 4) {
              itensNota.push({
                codigo: "-",
                produto: desc.slice(0, 80),
                descricao: desc.slice(0, 80),
                unidade: "UN",
                quantidade: 1,
                valorUnitario: vTot,
                valorTotal: vTot
              });
              adicionados++;
            }
          }
        }
        renderizarItens();
        setStatus("ok", "Informações lidas (" + adicionados + " item(ns) sugerido(s)). Confira e clique em 'Enviar Dados para o Apps Script'.");
      } catch (e) {
        setStatus("err", "Erro ao ler nota: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🔍 Ler Informações e Itens (OCR)";
      }
    }

    function adicionarItemManual() {
      const cod = document.getElementById("itemCod").value.trim() || "-";
      const nome = document.getElementById("itemNome").value.trim();
      const qtd = parseFloat(document.getElementById("itemQtd").value) || 1;
      const vUnit = parseFloat(document.getElementById("itemValor").value) || 0;
      if (!nome) return setStatus("err", "Informe o nome/descrição do item.");

      itensNota.push({
        codigo: cod,
        produto: nome,
        descricao: nome,
        unidade: "UN",
        quantidade: qtd,
        valorUnitario: vUnit,
        valorTotal: qtd * vUnit
      });

      document.getElementById("itemCod").value = "";
      document.getElementById("itemNome").value = "";
      document.getElementById("itemQtd").value = "1";
      document.getElementById("itemValor").value = "0";
      renderizarItens();
    }

    function removerItem(idx) {
      itensNota.splice(idx, 1);
      renderizarItens();
    }

    function renderizarItens() {
      document.getElementById("listaItensBody").innerHTML = itensNota.map((it, idx) =>
        "<tr><td>" + esc(it.codigo) + "</td><td>" + esc(it.produto) + "</td><td>" + it.quantidade +
        "</td><td>R$ " + Number(it.valorUnitario).toFixed(2) + "</td><td>R$ " + Number(it.valorTotal).toFixed(2) +
        "</td><td><button type='button' onclick='removerItem(" + idx + ")'>X</button></td></tr>"
      ).join("");
    }

    async function enviarDadosParaAppsScript() {
      if (!APPS_SCRIPT_EXEC_URL || !APPS_SCRIPT_EXEC_URL.includes("/exec")) {
        return setStatus("err", "Configure a URL /exec na constante APPS_SCRIPT_EXEC_URL do index.html.");
      }
      if (!quadroCapturado) {
        return setStatus("err", "Escaneie a nota pela câmera antes de enviar.");
      }

      const btn = document.getElementById("btnEnviar");
      btn.disabled = true;
      btn.textContent = "⏳ Enviando dados...";
      setStatus("info", "Enviando informações lidas para o Google Apps Script tratar...");

      try {
        const canvas = document.getElementById("scanCanvas");
        const imagemBase64 = canvas.toDataURL("image/jpeg", 0.65).split(",")[1];
        const numeroNota = document.getElementById("numeroNota").value.trim();
        const fornecedor = document.getElementById("fornecedor").value.trim();
        const categoria = document.getElementById("categoria").value;
        const recebedor = document.getElementById("recebedor").value.trim() || "Equipe SPX";
        const chave = document.getElementById("chaveNf").value.trim();
        const email = document.getElementById("emailDestino").value.trim();
        const valorTotal = itensNota.reduce((acc, it) => acc + (Number(it.valorTotal) || 0), 0);

        const resp = await fetch(APPS_SCRIPT_EXEC_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            chave,
            numeroNota,
            fornecedor,
            categoria,
            recebedor,
            email,
            valorTotal,
            itens: itensNota,
            imagemBase64,
            enviarEmail: true
          }),
          redirect: "follow"
        });

        const textoResp = await resp.text();
        let jsonResp = null;
        try { jsonResp = JSON.parse(textoResp); } catch (e) {}

        if (jsonResp && jsonResp.sucesso) {
          setStatus(
            "ok",
            "Dados enviados e tratados pelo Apps Script! Linha: " + jsonResp.linha +
            "\nItens salvos: " + jsonResp.totalItens +
            "\nE-mail enviado: " + (jsonResp.emailEnviado ? "Sim" : "Não") +
            "\nArquivo salvo no Drive: " + (jsonResp.pdfUrl || "OK")
          );
        } else {
          setStatus("err", "Falha no Apps Script:\n" + (jsonResp ? jsonResp.mensagem : textoResp.slice(0, 300)));
        }
      } catch (erro) {
        setStatus(
          "err",
          "Erro de conexão (Failed to fetch).\n" +
          "Confira no Apps Script: Implantar -> Gerenciar implantações -> Executar como: Eu e Quem pode acessar: Qualquer pessoa com o link.\n" +
          "Detalhe: " + erro.message
        );
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Enviar Dados para o Apps Script";
      }
    }

    function setStatus(tipo, msg) {
      const box = document.getElementById("statusBox");
      box.className = "status " + tipo;
      box.textContent = msg;
      box.style.display = "block";
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }
  </script>
</body>
</html>
